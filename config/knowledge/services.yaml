commercial_lab:
  name: "A2I Commercial Lab"
  tagline: "High-Performance Creative at Machine Speed"
  description: "64-second broadcast-ready commercials engineered from 8-second cinematic scenes. AI-powered production that delivers in hours, not weeks."

  tiers:
    - name: "Prototyper"
      price: "$599/mo"
      tokens: 16
      commercials: 2
      best_for: "Testing AI video for your brand"
    - name: "Growth"
      price: "$1,199/mo"
      tokens: 40
      commercials: 5
      best_for: "Scaling brands running 5+ ads/month"
      most_popular: true
    - name: "Scale"
      price: "$2,499/mo"
      tokens: 96
      commercials: 12
      best_for: "Automated production house needs"

  entry_point: "Rapid Pilot at $299 - try before you subscribe. 100% credited if you upgrade within 7 days."

  process:
    steps:
      - "Complete guided intake (< 5 min)"
      - "AI generates script and scene prompts"
      - "RAGNAROK pipeline produces 8 scenes"
      - "VORTEX assembles final commercial"
      - "QA validation and delivery"
