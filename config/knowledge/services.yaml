  features:
    - "AI upscaling to 4K"
    - "Color grading"
    - "Beat-sync audio"
    - "Transitions between scenes"
    - "Format optimization"
    - "Caption burn-in"

clone_services:
  voice_clone:
    price: 199
    description: "Train AI to speak in your voice"
    requirements: "30-60 second voice sample"
    use_cases: "Consistent brand voice across commercials"
    included_at: "Scale tier"
  avatar_clone:
    price: 999
    description: "Create AI version of you for video"
    requirements: "Front and side photos, video reference footage, consent documentation"
    use_cases: "Appear in commercials without filming"
    included_at: "Scale tier"
  total_value: "$1,198 (both included free at Scale)"

intake_checklist:
  brand_dna:
    - "Business name & URL"
    - "Logo (high-res)"
    - "Style guide (if available)"
    - "Brand colors"
  mission:
    - "Campaign goal"
    - "Target audience"
    - "Geographic focus"
    - "Key message"
  creative:
    - "Product description"
    - "Must-say lines"
    - "Competitor references"
    - "Preferred tone"
  identity_assets:
    tier: "Scale tier (or add-on)"
    items:
      - "Voice sample (30-60s)"
      - "Avatar photos (front/side)"
      - "Video reference footage"
      - "Consent documentation"
  technical:
    - "Platform priority"
    - "Format preference"
    - "B-roll (optional)"
    - "Music preference"
