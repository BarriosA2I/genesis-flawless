  deliverables:
    hero_commercial:
      description: "1x 64-second complete commercial"
    cutdowns:
      description: "FREE variant stack included"
      includes:
        - "3x 15-second cutdowns"
        - "3x 6-8 second micro ads"
    formats:
      description: "Multiple aspect ratios based on tier"
      options:
        - "9:16 Vertical (TikTok/Reels/Stories)"
        - "16:9 Horizontal (YouTube)"
        - "1:1 Square (Feed)"
        - "4:5 Portrait (Instagram)"
    captions:
